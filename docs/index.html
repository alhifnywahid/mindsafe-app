<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindSafe - Mengalihkan ke repositori GitHub</title>

    <link rel="canonical" href="https://github.com/alhifnywahid/mindsafe-app" />
    <meta
      http-equiv="refresh"
      content="0; url=https://github.com/alhifnywahid/mindsafe-app"
    />

    <meta
      name="description"
      content="MindSafe - aplikasi monitoring aktivitas akses domain berbasis smartphone. Halaman ini mengalihkan ke repositori GitHub."
    />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MindSafe" />
    <meta
      property="og:description"
      content="Aplikasi monitoring aktivitas akses domain berbasis smartphone - Flutter + Local VPN."
    />
    <meta
      property="og:url"
      content="https://github.com/alhifnywahid/mindsafe-app"
    />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <style>
      :root {
        --bg: #0f172a;
        --bg2: #1b2440;
        --card: #16203a;
        --fg: #e8ecf6;
        --muted: #95a3c4;
        --line: #2c3a5e;
        --accent: #8b5cf6;
        --accent2: #6366f1;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--fg);
        background: radial-gradient(
          1200px 600px at 50% -10%,
          var(--bg2) 0%,
          var(--bg) 60%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 520px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }
      .tag {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .status {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 0 0 24px;
        word-break: break-all;
      }
      .status b {
        color: var(--fg);
        font-weight: 600;
      }
      a.btn {
        display: inline-block;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 13px 26px;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, var(--accent2), var(--accent));
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }
      a.btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }
      a.btn:focus-visible {
        outline: 3px solid #a78bfa;
        outline-offset: 3px;
      }
      .links {
        margin-top: 22px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .links a {
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
        margin: 0 8px;
      }
      .links a:hover {
        color: var(--fg);
      }
      footer {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 0.75rem;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        a.btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="mark"
        viewBox="0 0 96 96"
        role="img"
        aria-label="Logo MindSafe"
      >
        <rect x="4" y="4" width="88" height="88" rx="24" fill="#8B5CF6" />
        <path
          d="M48 18 L74 27 V50 C74 64 62 74 48 80 C34 74 22 64 22 50 V27 Z"
          fill="#0f172a"
          stroke="#FFE600"
          stroke-width="4"
          stroke-linejoin="round"
        />
        <path
          d="M31 50 H40 L44 40 L50 61 L55 50 H65"
          fill="none"
          stroke="#FFE600"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <h1>MindSafe</h1>
      <p class="tag">
        Aplikasi monitoring aktivitas akses domain berbasis smartphone
      </p>

      <p class="status">
        Mengalihkan ke <b>github.com/alhifnywahid/mindsafe-app</b> …
      </p>

      <a class="btn" href="https://github.com/alhifnywahid/mindsafe-app">
        Buka Repositori GitHub &rarr;
      </a>

      <p class="links">
        <a href="https://github.com/alhifnywahid/mindsafe-app#readme"
          >Dokumentasi</a
        >·<a href="https://github.com/alhifnywahid/mindsafe-app/releases"
          >Rilis</a
        >·<a
          href="https://github.com/alhifnywahid/mindsafe-app/blob/master/LICENSE"
          >Lisensi MIT</a
        >
      </p>

      <footer>
        Tugas Akhir &middot; Alhifny Wahid &middot; Universitas Dr. Soetomo
      </footer>
    </main>

    <script>
      location.replace("https://github.com/alhifnywahid/mindsafe-app");
    </script>
  </body>
</html>
