name: mindsafe_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  google_sign_in: ^6.2.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts
  fl_chart: ^0.69.2
  
  # UI
  forui: ^0.18.0
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  
  # Notifications
  flutter_local_notifications: ^19.0.0
  
  # Utils
  intl: ^0.20.1
  shared_preferences: ^2.3.4
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  package_info_plus: ^8.0.0
  table_calendar: ^3.2.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/blocklists/
